<script>

let idusuario = localStorage.getItem("idusuario");

if (idusuario) {

    fetch("inicio.php?idusuario=" + encodeURIComponent(idusuario))

    .then(response => response.json())

    .then(data => {

        if (data.error) {

            console.log(data.error);

            return;
        }

        document.getElementById("pedidosActivos").textContent =
            data.pedidos_activos;


        if (data.proxima_fecha) {

            let fecha = new Date(
                data.proxima_fecha.replace(" ", "T")
            );

            let hoy = new Date();

            let manana = new Date();

            manana.setDate(hoy.getDate() + 1);


            let textoFecha;


            if (
                fecha.getDate() === hoy.getDate() &&
                fecha.getMonth() === hoy.getMonth() &&
                fecha.getFullYear() === hoy.getFullYear()
            ) {

                textoFecha = "Hoy";

            } else if (
                fecha.getDate() === manana.getDate() &&
                fecha.getMonth() === manana.getMonth() &&
                fecha.getFullYear() === manana.getFullYear()
            ) {

                textoFecha = "Mañana";

            } else {

                textoFecha =
                    fecha.toLocaleDateString("es-AR", {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    });

            }

            document.getElementById("proximaEntrega").textContent =
                textoFecha;

        } else {

            document.getElementById("proximaEntrega").textContent =
                "Sin pedidos";

        }

    })

    .catch(error => {

        console.error("Error:", error);

    });

} else {

    console.log("No existe idusuario en localStorage");

}

</script>
