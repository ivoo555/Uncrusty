        }

        .boton-enviar {
            margin-left: 8px;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

    <div class="pedidos-shell-outer">

        <div class="pedidos-shell">

            <h1>Mi Historial</h1>

            <div class="tabla-pedidos">

                <table>

                    <caption>Historial</caption>

                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Precio</th>
                            <th>Calificación</th>
                        </tr>
                    </thead>

                    <tbody id="historial">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        const idusuario = localStorage.getItem("idusuario");

        console.log("ID USUARIO:", idusuario);


        if (!idusuario) {

            console.log("No existe idusuario en localStorage");

        } else {

            const url =
                "../../php/historial.php?idusuario=" +
                encodeURIComponent(idusuario);

            console.log("URL:", url);


            fetch(url)

                .then(response => response.text())

                .then(texto => {

                    console.log("RESPUESTA PHP:", texto);

                    let data;

                    try {

                        data = JSON.parse(texto);

                    } catch (error) {

                        console.error(
                            "El PHP no devolvió JSON:",
                            texto
                        );

                        return;
                    }


                    const historial =
                        document.getElementById("historial");

                    historial.innerHTML = "";


                    if (data.error) {

                        console.error(
                            "Error PHP:",
                            data.error
                        );

                        historial.innerHTML = `
                            <tr>
                                <td colspan="5">
                                    ${data.error}
                                </td>
                            </tr>
                        `;

                        return;
                    }


                    if (!Array.isArray(data) || data.length === 0) {

                        historial.innerHTML = `
                            <tr>
                                <td colspan="5">
                                    No hay pedidos en el historial
                                </td>
                            </tr>
                        `;

                        return;
                    }


                    data.forEach(pedido => {

                        const calificacion =
                            Number(pedido.estrellas) || 0;


                        const fila =
                            document.createElement("tr");


                        fila.innerHTML = `

                            <td>
                                #${pedido.idPedido}
                            </td>

                            <td>
                                ${pedido.servicio || pedido.id_servicio || "Sin servicio"}
                            </td>

                            <td>
                                ${pedido.fecha_pedido || "-"}
                            </td>

                            <td>
                                $${Number(pedido.total || 0).toFixed(2)}
                            </td>

                            <td>

                                <div
                                    class="calificacion"
                                    data-pedido="${pedido.idPedido}"
                                >

                                    ${[1, 2, 3, 4, 5].map(numero => `

                                        <span
                                            class="estrella ${
                                                numero <= calificacion
                                                    ? "activa"
                                                    : ""
                                            }"
                                            data-valor="${numero}"
                                        >
                                            ★
                                        </span>

                                    `).join("")}


                                    <button
                                        class="boton-enviar"
                                        onclick="enviarCalificacion(${pedido.idPedido})"
                                    >
                                        Enviar
                                    </button>

                                </div>

                            </td>
                        `;


                        historial.appendChild(fila);


                        const estrellas =
                            fila.querySelectorAll(".estrella");


                        estrellas.forEach(estrella => {

                            estrella.addEventListener(
                                "click",
                                function () {

                                    const valor =
                                        parseInt(
                                            this.dataset.valor
                                        );


                                    estrellas.forEach(otra => {

                                        const numero =
                                            parseInt(
                                                otra.dataset.valor
                                            );


                                        if (numero <= valor) {

                                            otra.classList.add(
                                                "activa"
                                            );

                                        } else {

                                            otra.classList.remove(
                                                "activa"
                                            );
                                        }

                                    });


                                    fila.querySelector(
                                        ".calificacion"
                                    ).dataset.seleccionada = valor;

                                }
                            );

                        });

                    });

                })

                .catch(error => {

                    console.error(
                        "Error:",
                        error
                    );

                });
        }


        function enviarCalificacion(idPedido) {

            const contenedor =
                document.querySelector(
                    `.calificacion[data-pedido="${idPedido}"]`
                );


            const estrellas =
                contenedor.dataset.seleccionada;


            if (!estrellas) {

                alert("Seleccione una calificación");

                return;
            }


            const datos = new FormData();

            datos.append(
                "idPedido",
                idPedido
            );

            datos.append(
                "estrellas",
                estrellas
            );


            fetch("../../php/calificar.php", {

                method: "POST",

                body: datos

            })

            .then(response => response.json())

            .then(data => {

                if (data.success) {

                    alert(
                        "Calificación guardada"
                    );

                } else {

                    alert(
                        data.error ||
                        "No se pudo guardar la calificación"
                    );
                }

            })

            .catch(error => {

                console.error(
                    "Error:",
                    error
                );

                alert(
                    "Error al enviar la calificación"
                );

            });
        }

    </script>

</body>

</html>
