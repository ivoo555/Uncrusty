<div class="pedidos-shell-outer">

<div class="pedidos-shell">

<h1>Mi Historial</h1>

<div class="tabla-pedidos">

<table>

<caption>Historial</caption>

<thead>

<tr>

<th>Pedido</th>

<th>Servicio</th>

<th>Fecha</th>

<th>Precio</th>

<th>Calificación</th>

</tr>

</thead>

<tbody id="historial">

</tbody>

</table>

</div>

</div>

</div>

<script>

let idusuario = localStorage.getItem("idusuario");

console.log("ID USUARIO:", idusuario);

if (idusuario) {

    let url = "historial.php?idusuario=" + encodeURIComponent(idusuario);

    console.log("URL:", url);

    fetch(url)
    .then(response => response.text())
    .then(texto => {

        console.log("RESPUESTA PHP:", texto);

        let data;

        try {

            data = JSON.parse(texto);

        } catch (error) {

            console.error("El PHP no devolvió JSON:", texto);
            return;

        }

        let historial = document.getElementById("historial");

        historial.innerHTML = "";

        if (data.error) {

            console.log("Error PHP:", data.error);
            return;

        }

        if (data.length === 0) {

            historial.innerHTML = `
                <tr>
                    <td colspan="5">No hay pedidos en el historial</td>
                </tr>
            `;

            return;

        }

        for (let i = 0; i < data.length; i++) {

            let pedido = data[i];

            let calificacion = pedido.estrellas || 0;

            let fila = document.createElement("tr");

            fila.innerHTML = `
                <td>${pedido.idPedido}</td>

                <td>${pedido.id_servicio}</td>

                <td>${pedido.fecha_pedido}</td>

                <td>${pedido.total}</td>

                <td>

                    <div class="calificacion" data-pedido="${pedido.idPedido}">

                        ${[1,2,3,4,5].map(numero => `
                            <span
                                class="estrella ${numero <= calificacion ? "activa" : ""}"
                                data-valor="${numero}"
                            >★</span>
                        `).join("")}

                        <button
                            class="boton-enviar"
                            onclick="enviarCalificacion(${pedido.idPedido})"
                        >
                            Enviar
                        </button>

                    </div>

                </td>
            `;

            historial.appendChild(fila);

            let estrellas = fila.querySelectorAll(".estrella");

            estrellas.forEach(estrella => {

                estrella.addEventListener("click", function() {

                    let valor = parseInt(this.dataset.valor);

                    estrellas.forEach(otra => {

                        let numero = parseInt(otra.dataset.valor);

                        if (numero <= valor) {

                            otra.classList.add("activa");

                        } else {

                            otra.classList.remove("activa");

                        }

                    });

                    fila.querySelector(".calificacion").dataset.seleccionada = valor;

                });

            });

        }

    })
    .catch(error => {

        console.error("Error:", error);

    });

} else {

    console.log("No existe idusuario en localStorage");

}


function enviarCalificacion(idPedido) {

    let contenedor = document.querySelector(
        `.calificacion[data-pedido="${idPedido}"]`
    );

    let estrellas = contenedor.dataset.seleccionada;

    if (!estrellas) {

        alert("Seleccione una calificación");

        return;

    }

    let datos = new FormData();

    datos.append("idPedido", idPedido);
    datos.append("estrellas", estrellas);

    fetch("calificar.php", {
        method: "POST",
        body: datos
    })
    .then(response => response.json())
    .then(data => {

        if (data.success) {

            alert("Calificación guardada");

        } else {

            alert(data.error);

        }

    })
    .catch(error => {

        console.error("Error:", error);
        alert("Error al enviar la calificación");

    });

}

</script>
