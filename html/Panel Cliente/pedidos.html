<div class="pedidos-shell-outer">

  <div class="pedidos-shell">

    <h1>Mis pedidos</h1>

    <div class="tabla-pedidos">

      <table>

        <caption>Pedidos</caption>

        <thead>
          <tr>
            <th>Producto</th>
            <th>Servicio</th>
            <th>Horario de recoleccion</th>
            <th>Estado</th>
            <th>Ubicación del pedido</th>
          </tr>
        </thead>

        <tbody id="pedidos"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

fetch("pedidos.php")
    .then(response => {
        if (!response.ok) {
            throw new Error("Error HTTP: " + response.status);
        }

        return response.json();
    })
    .then(data => {

        const tabla = document.getElementById("pedidos");

        if (!data.ok) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="5">${data.mensaje}</td>
                </tr>
            `;
            return;
        }

        if (data.pedidos.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="5">No hay pedidos pendientes.</td>
                </tr>
            `;
            return;
        }

        data.pedidos.forEach(pedido => {

            let estadoClase = "estado-pendiente";

            if (pedido.estado === "En recolección") {
                estadoClase = "estado-recoleccion";
            }

            if (pedido.estado === "En limpieza") {
                estadoClase = "estado-limpieza";
            }

            if (pedido.estado === "Listo para la entrega") {
                estadoClase = "estado-listo";
            }

            let horario = pedido.fecha_programada || "";

            let ubicacion = pedido.direccion_reparto || pedido.direccion_entrega || "";

            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td class="producto">${pedido.id_pedido}</td>
                <td>${pedido.id_servicio}</td>
                <td class="horario">${horario}</td>
                <td>
                    <span class="estado ${estadoClase}">
                        ${pedido.estado}
                    </span>
                </td>
                <td class="ubicacion">${ubicacion}</td>
            `;

            tabla.appendChild(fila);

        });

    })
    .catch(error => {

        console.error("Error al cargar pedidos:", error);

        document.getElementById("pedidos").innerHTML = `
            <tr>
                <td colspan="5">Error al cargar los pedidos.</td>
            </tr>
        `;

    });

</script>
