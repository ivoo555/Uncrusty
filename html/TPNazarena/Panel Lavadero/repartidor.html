<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestionar Pedidos</title>

<link rel="stylesheet" href="pedidos.css">

</head>

<body>

<h1 id="Titulo">
    Panel Gestión de Pedidos
</h1>

<div id="MarcoProductos">

<div id="MarcoTitulo">

    <h1>
        Tabla de pedidos
    </h1>

</div>


<div id="tabla">

    <table>

        <thead>

            <tr>

                <th>Id Pedido</th>

                <th>Id Repartidor</th>

                <th>Tipo</th>

                <th>Dirección</th>

                <th>Fecha Programada</th>

                <th>Fecha Realizada</th>

                <th>Estado</th>

                <th>Observaciones</th>

                <th>Acciones</th>

            </tr>

        </thead>


        <tbody id="tablaPedidos">

            <!-- Los pedidos aparecen acá -->

        </tbody>

    </table>

</div>


<button id="botonModificar" disabled>
    Modificar
</button>

</div>



<script>


let idrepartidor = localStorage.getItem("idrepartidor");


// Acá solamente se guardan los pedidos
// cuyo estado fue modificado

let cambios = [];



console.log(
    "ID del repartidor:",
    idrepartidor
);



if (idrepartidor == null) {


    alert(
        "No se encontro el id del repartidor"
    );


} else {


    fetch(
        "repartir.php?idrepartidor=" +
        idrepartidor
    )


    .then(respuesta => {


        console.log(
            "Respuesta de repartir.php:",
            respuesta
        );


        return respuesta.json();

    })


    .then(data => {


        console.log(
            "Datos recibidos:",
            data.repartos
        );


        localStorage.setItem(
            "cantidad_columnas",
            data.cantidad_columnas
        );



        let tabla =
            document.getElementById(
                "tablaPedidos"
            );



        data.repartos.forEach(
            reparto => {


                let fila =
                    document.createElement(
                        "tr"
                    );



                fila.innerHTML = `

                    <td>
                        ${reparto.id_pedido}
                    </td>

                    <td>
                        ${reparto.id_repartidor}
                    </td>

                    <td>
                        ${reparto.tipo}
                    </td>

                    <td>
                        ${reparto.direccion}
                    </td>

                    <td>
                        ${reparto.fecha_programada}
                    </td>

                    <td>
                        ${reparto.fecha_realizada}
                    </td>


                    <td>

                        <strong>
                            Estado actual:
                        </strong>

                        <br>

                        <span class="estadoActual">
                            ${reparto.estado}
                        </span>


                        <br>
                        <br>


                        <strong>
                            Cambiar estado:
                        </strong>

                        <br>


                        <select class="estado">

                            <option value="Pendiente">
                                Pendiente
                            </option>

                            <option value="En proceso">
                                En proceso
                            </option>

                            <option value="Completado">
                                Completado
                            </option>

                        </select>

                    </td>


                    <td>
                        ${reparto.observaciones}
                    </td>


                    <td>
                    </td>

                `;



                tabla.appendChild(
                    fila
                );



                // Obtener el select de esta fila

                let select =
                    fila.querySelector(
                        ".estado"
                    );



                // Guardar el estado original

                let estadoOriginal =
                    reparto.estado;



                // Seleccionar el estado
                // que viene desde PHP

                select.value =
                    estadoOriginal;



                console.log(
                    "Pedido:",
                    reparto.id_pedido
                );



                console.log(
                    "Estado original:",
                    estadoOriginal
                );



                // Detectar modificación

                select.addEventListener(
                    "change",
                    function() {


                        console.log(
                            "Estado seleccionado:",
                            select.value
                        );



                        // Si vuelve al estado original,
                        // ya no hay modificación

                        if (
                            select.value ===
                            estadoOriginal
                        ) {


                            cambios =
                                cambios.filter(
                                    cambio =>
                                        cambio.id_pedido !==
                                        reparto.id_pedido
                                );


                        }

                        else {


                            // Buscar si el pedido
                            // ya fue modificado

                            let cambioExistente =
                                cambios.find(
                                    cambio =>
                                        cambio.id_pedido ===
                                        reparto.id_pedido
                                );



                            if (
                                cambioExistente
                            ) {


                                // Actualizar el cambio

                                cambioExistente.estado =
                                    select.value;


                            }

                            else {


                                // Guardar nuevo cambio

                                cambios.push({

                                    id_pedido:
                                        reparto.id_pedido,

                                    estado:
                                        select.value

                                });


                            }

                        }



                        console.log(
                            "CAMBIOS A ENVIAR:",
                            cambios
                        );



                        // Activar el botón solamente
                        // si existe algún cambio

                        if (
                            cambios.length > 0
                        ) {

                            document.getElementById(
                                "botonModificar"
                            ).disabled = false;

                        }

                        else {

                            document.getElementById(
                                "botonModificar"
                            ).disabled = true;

                        }


                    }
                );


            }
        );


    })


    .catch(error => {


        console.log(
            "Error al obtener los repartos:",
            error
        );


    });

}



// TÍTULO DE LA TABLA


let marco =
    document.getElementById(
        "MarcoTitulo"
    );


let cantidad_columnas =
    localStorage.getItem(
        "cantidad_columnas"
    );


marco.querySelector(
    "h1"
).textContent =
    "Tabla De Pedidos-" +
    cantidad_columnas +
    " pendientes.";



// BOTÓN MODIFICAR


document.getElementById(
    "botonModificar"
).addEventListener(
    "click",
    function() {


        // Verificar que exista
        // al menos un cambio

        if (
            cambios.length === 0
        ) {

            alert(
                "No hay cambios para enviar."
            );

            return;

        }



        console.log(
            "================================"
        );


        console.log(
            "ENVIANDO ESTOS DATOS:"
        );


        console.log(
            cambios
        );


        console.log(
            "================================"
        );



        // Enviar solamente los cambios

        fetch(
            "modificartabla.php",
            {

                method: "POST",


                headers: {

                    "Content-Type":
                        "application/json"

                },


                body:
                    JSON.stringify({

                        cambios:
                            cambios

                    })

            }
        )


        .then(respuesta => {


            console.log(
                "Respuesta del servidor:",
                respuesta
            );


            return respuesta.json();


        })


        .then(data => {


            console.log(
                "Datos recibidos del PHP:",
                data
            );



            if (
                data.exito === true
            ) {


                alert(
                    "Datos enviados correctamente"
                );



                // Actualizar los estados
                // mostrados como actuales

                document
                    .querySelectorAll(
                        "#tablaPedidos tr"
                    )
                    .forEach(
                        fila => {


                            let select =
                                fila.querySelector(
                                    ".estado"
                                );


                            let estadoActual =
                                fila.querySelector(
                                    ".estadoActual"
                                );


                            if (
                                select &&
                                estadoActual
                            ) {

                                estadoActual.textContent =
                                    select.value;

                            }

                        }
                    );



                // Vaciar cambios

                cambios = [];



                // Desactivar botón

                document.getElementById(
                    "botonModificar"
                ).disabled = true;


            }

            else {


                alert(
                    "Error: " +
                    data.mensaje
                );


            }


        })


        .catch(error => {


            console.log(
                "Error al enviar los datos:",
                error
            );


            alert(
                "No se pudieron enviar los datos."
            );


        });


    }
);


</script>

</body>

</html>
