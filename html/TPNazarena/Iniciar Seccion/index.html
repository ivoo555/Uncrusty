<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNCRUSTY - Dashboard Repartidor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #e2e8f0; padding-bottom: 24px; display: flex; flex-direction: column; align-items: center; }
        
        .app-container { width: 100%; max-width: 480px; }

        /* Barra de Navegación Superior (Navbar) */
        .navbar {
            width: 100%;
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            margin-bottom: 16px;
        }

        .navbar-brand { font-size: 16px; font-weight: bold; }
        
        .navbar-nav {
            display: flex;
            gap: 12px;
        }

        .nav-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .nav-link.active {
            color: #ffffff;
            background-color: #0284c7;
        }

        /* Panel de Estado */
        .status-card {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 16px;
            margin: 0 16px 16px 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .driver-name { font-size: 18px; font-weight: bold; color: #0f172a; }
        .driver-role { font-size: 12px; color: #64748b; font-weight: bold; margin-top: 2px; }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f1f5f9;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin-top: 12px;
        }

        .toggle-label { font-size: 13px; font-weight: bold; color: #334155; }
        .badge-active { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }

        /* Cuadrícula de Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 16px;
        }

        .metric-box {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .metric-number { font-size: 26px; font-weight: bold; color: #0284c7; margin-bottom: 2px; }
        .metric-title { font-size: 12px; font-weight: bold; color: #64748b; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Navbar Superior con Accesos -->
        <nav class="navbar">
            <span class="navbar-brand">UNCRUSTY</span>
            <div class="navbar-nav">
                <a href="#" class="nav-link active">Inicio</a>
                <a href="#" class="nav-link">📋 Hoja de Ruta</a>
                <a href="#" class="nav-link">🗺️ Mapa</a>
            </div>
        </nav>

        <!-- Tarjeta de Estado del Repartidor -->
        <div class="status-card">
            <div class="header-top">
                <div>
                    <div class="driver-name">Carlos Rodríguez</div>
                    <div class="driver-role">Unidad N° 3 (Camioneta)</div>
                </div>
                <span class="badge-active">● EN SERVICIO</span>
            </div>

            <div class="toggle-container">
                <span class="toggle-label">Disponibilidad para Entregas</span>
                <span style="font-size: 12px; font-weight: bold; color: #16a34a;">Disponible</span>
            </div>
        </div>

        <!-- Resumen de Métricas del Día -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-number">4</div>
                <div class="metric-title">Pendientes</div>
            </div>
            <div class="metric-box">
                <div class="metric-number" style="color: #16a34a;">6</div>
                <div class="metric-title">Completados</div>
            </div>
            <div class="metric-box">
                <div class="metric-number" style="color: #b45309;">2</div>
                <div class="metric-title">Recolecciones</div>
            </div>
            <div class="metric-box">
                <div class="metric-number" style="color: #1e40af;">2</div>
                <div class="metric-title">Entregas</div>
            </div>
        </div>

    </div>

</body>
</html>
