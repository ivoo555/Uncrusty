<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión — Lavandería</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <form class="card" id="login-form" action="megustaelepe.php" method="POST" novalidate>
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A86C4" stroke-width="1.8">
        <circle cx="12" cy="12" r="7"/>
        <circle cx="12" cy="12" r="2.5"/>
      </svg>
    </div>
 
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Accedé según tu rol: cliente, personal o repartidor</p>
 
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="nombre@correo.com" autocomplete="username" required>
    </div>
 
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
 
    <p class="forgot"><a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a></p>
 
    <button  class = "btn-primary" type="submit">Ingresar</button>
 
    <p class="error" id="error-message" role="alert">Correo o contraseña incorrectos. Intentá de nuevo.</p>
 
    <p class="footer">¿Sos cliente nuevo? <a href="registro.html" id="register-link">Registrate</a></p>
  </form>
</main>
 
</body>
</html>
