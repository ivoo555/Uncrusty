<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Stock</title>
    <link rel="stylesheet" href="modificarStock.css">
</head>
<body>

    <div class="contenedor">

        <h1>Modificar Stock</h1>
        <form id="formProducto">
            <label >Marca</label>
            <input type="text" name="" id="Marca" placeholder="Introduzca la marca">
            <label >Nueva Cantidad</label>
            <input type="number" id="nuevaCantidad" min="0" required>

            <label >Stock Mínimo</label>
            <input type="number" id="stockMinimo" min="0" required>

            <div class="botones">
                <button type="submit">Guardar Cambios</button>
                <button type="button" id="cancelar">Cancelar</button>
            </div>
        </form>
    </div>

    <script src="modificarStock.js"></script>

</body>
</html>
