
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Cupón</title>
    <link rel="stylesheet" href="modificarCupon.css">
</head>
<body>

    <div class="contenedor">

        <h1>Modificar Cupón</h1>

        <form id="formCupon">
            <input type="hidden" id="id_cupon">
            <label>Codigo</label>
            <input type="text" name="" id="codigo" placeholder="Ingrese el codigo">

            <label >Descuento</label>
            <input type="number" id="descuento" min="0" step="0.01" placeholder="Ingrese el descuento" required>

            <label >Fecha de Inicio</label>
            <input type="date" id="fechaInicio" required>

            <label>Fecha de Vencimiento</label>
            <input type="date" id="fechaFin" required>

            <div class="botones">
                <button type="submit">Guardar Cambios</button>
                <button type="button" id="cancelar">Cancelar</button>
            </div>

        </form>

    </div>

    <script src="modificarCupon.js"></script>

</body>
</html>
