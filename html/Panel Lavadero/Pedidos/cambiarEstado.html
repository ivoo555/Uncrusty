<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar Estado del Pedido</title>

    <link rel="stylesheet" href="cambiarEstado.css">
</head>

<body>

    <main class="contenedor">

        <h1>Cambiar Estado del Pedido</h1>

        <form id="formEstado">

            <div class="campo">

                <label for="selectPedido">
                    Pedido
                </label>

                <input type="text" name="" id="inputPedido" readonly>

            </div>


            <div class="campo">

                <label for="estadoActual">
                    Estado actual
                </label>

                <input
                    type="text"
                    id="estadoActual"
                    readonly>

            </div>


            <div class="campo">

                <label for="nuevoEstado">
                    Nuevo estado
                </label>

                <select id="nuevoEstado" required>

                    <option value="">
                        Seleccione un estado
                    </option>

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="En Recolección">
                        En Recolección
                    </option>

                    <option value="En Limpieza">
                        En Limpieza
                    </option>

                    <option value="Listo para entrega">
                        Listo para entrega
                    </option>

                    <option value="Entregado">
                        Entregado
                    </option>

                </select>

            </div>


            <div class="botones">

                <button type="submit">
                    Guardar cambios
                </button>

                <button
                    type="button"
                    id="btnCancelar">
                    Cancelar
                </button>

            </div>

        </form>

    </main>


    <script src="cambiarEstado.js"></script>

</body>

</html>
